<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>みんなのボード</title>
<style>
:root{
  --bg:#f4f1ea; --ink:#22313f; --sub:#6b7785; --line:#d9d3c7; --card:#ffffff;
  --accent:#2f6fde; --accent-ink:#fff; --danger:#d64545; --ok:#2a9d6a; --warn:#e8a33d;
  --c-yellow:#ffe680; --c-pink:#ffbfd6; --c-blue:#aed8ff; --c-green:#bdeba9; --c-orange:#ffcb8f; --c-purple:#d9c8ff;
  --shadow:0 2px 6px rgba(30,40,60,.18);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  -webkit-text-size-adjust:100%;}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:10px;padding:8px 14px;line-height:1.2}
button:hover{background:#f7f7f7}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.07)}
button.danger{color:var(--danger);border-color:#f0c4c4}
button.big{font-size:17px;padding:12px 16px;width:100%;font-weight:700}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid #9cbcf5;border-color:var(--accent)}
.muted{color:var(--sub)}
.demo-banner{background:#fff4d6;border-bottom:1px solid #f0dca3;padding:6px 14px;font-size:13px;text-align:center}

/* ---- ホーム ---- */
.page{max-width:760px;margin:0 auto;padding:28px 18px 60px}
.logo{font-size:28px;font-weight:800;letter-spacing:.04em;margin:8px 0 4px}
.logo span{display:inline-block;transform:rotate(-4deg);background:var(--c-yellow);padding:2px 10px;border-radius:4px;box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
.card h2{font-size:17px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.board-item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-top:1px solid #eee}
.board-item:first-child{border-top:none}
.board-item .t{font-weight:700}
.board-item .q{font-size:13px;color:var(--sub);margin-top:2px}
.board-item .grow{flex:1;min-width:0}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:#eee;color:#666;margin-left:6px;vertical-align:2px}
.footer-link{margin-top:40px;font-size:13px;text-align:center}
.footer-link a{color:var(--sub)}

/* ---- ボード画面 ---- */
.bscreen{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);z-index:20;min-height:58px}
.bar .titles{flex:1;min-width:0}
.bar .btitle{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bsub{font-size:12px;color:var(--sub)}
.conn{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px}
.conn.bad{background:var(--danger)}
.timer{font-variant-numeric:tabular-nums;font-size:30px;font-weight:800;padding:2px 14px;border-radius:12px;background:#eef3fc;min-width:120px;text-align:center}
.timer.hidden{display:none}
.timer.paused{color:var(--sub)}
.timer.low{background:#fde7e7;color:var(--danger)}
.timer.done{background:var(--danger);color:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.tprog{height:4px;background:#e6e6e6;position:relative;z-index:19}
.tprog i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.pill{font-size:14px;font-weight:700;padding:6px 12px;border-radius:99px;background:#fff7d1;border:1px solid #f0dd8c;white-space:nowrap}
.question{background:#22313f;color:#fff;padding:8px 16px;font-size:16px;font-weight:700;text-align:center;line-height:1.4;z-index:18}
.question:empty{display:none}
.vp{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab;
  background-color:#efebe2}
.vp.grabbing{cursor:grabbing}
.board{position:absolute;left:0;top:0;transform-origin:0 0;
  background-color:#fbfaf6;
  background-image:radial-gradient(#d6d0c3 1.3px,transparent 1.3px);background-size:28px 28px;
  border-radius:18px;box-shadow:0 0 0 1px #e2dccf}
.note{position:absolute;width:180px;height:180px;padding:12px 12px 34px;border-radius:4px;box-shadow:var(--shadow);
  cursor:pointer;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;transition:box-shadow .15s}
.note.dragging{box-shadow:0 10px 24px rgba(30,40,60,.3);z-index:5;transition:none}
.note .txt{flex:1;overflow:hidden;white-space:pre-wrap;word-break:break-all;line-height:1.35}
.note .txt.l{font-size:24px;font-weight:700}
.note .txt.m{font-size:18px}
.note .txt.s{font-size:14px}
.note .meta{position:absolute;left:10px;right:8px;bottom:6px;display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(0,0,0,.55)}
.note .meta .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note .vote{padding:2px 8px;font-size:13px;border-radius:99px;background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.12);display:none}
.note .vote.show{display:inline-block}
.note .vote.mine{background:#ffcf33;border-color:#d9a400;font-weight:800}
.note .vote:disabled{opacity:1;cursor:default}
.note.mine{outline:2px solid rgba(47,111,222,.55);outline-offset:2px}
.note .rank{position:absolute;top:-12px;right:-10px;background:var(--danger);color:#fff;font-weight:800;font-size:13px;border-radius:99px;padding:4px 9px;box-shadow:var(--shadow)}
.c-yellow{background:var(--c-yellow)} .c-pink{background:var(--c-pink)} .c-blue{background:var(--c-blue)}
.c-green{background:var(--c-green)} .c-orange{background:var(--c-orange)} .c-purple{background:var(--c-purple)}
.fab{position:absolute;left:16px;bottom:18px;z-index:16}
.fab button{font-size:18px;font-weight:800;padding:14px 22px;border-radius:99px;box-shadow:var(--shadow)}
.zoom{position:absolute;right:16px;bottom:18px;z-index:16;display:flex;gap:6px}
.zoom button{width:46px;height:46px;padding:0;font-size:20px;border-radius:12px;box-shadow:var(--shadow)}
.hint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:14;font-size:13px;color:var(--sub);background:rgba(255,255,255,.85);padding:6px 12px;border-radius:99px;pointer-events:none}

/* 先生パネル */
.panel{position:absolute;top:0;right:0;bottom:0;width:330px;max-width:92vw;background:#fff;border-left:1px solid var(--line);z-index:30;
  overflow-y:auto;padding:12px 14px 40px;transform:translateX(100%);transition:transform .2s;box-shadow:-6px 0 20px rgba(0,0,0,.08)}
.panel.open{transform:none}
.panel h3{font-size:14px;margin:0 0 8px;color:#3a4652}
.panel section{border-top:1px solid #eee;padding:14px 0}
.panel section:first-of-type{border-top:none}
.panel .row{margin:6px 0}
.panel label{font-size:13px;display:flex;align-items:center;gap:6px;margin:6px 0}
.panel input[type=number]{width:70px}
.panel .stats{font-size:13px;color:var(--sub)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.stop-banner{position:absolute;top:0;left:0;right:0;z-index:14;background:var(--danger);color:#fff;text-align:center;font-weight:700;padding:6px;font-size:14px}
.stop-banner.hidden{display:none}

/* 生徒の停止画面 */
.stopov{position:fixed;inset:0;z-index:60;background:rgba(34,49,63,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.stopov.hidden{display:none}
.stopov .hand{font-size:96px;line-height:1}
.stopov .msg{font-size:30px;font-weight:800;margin-top:18px}
.stopov .small{margin-top:10px;opacity:.75}

/* モーダル */
.modal-bg{position:fixed;inset:0;z-index:70;background:rgba(20,28,36,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:820px}
.modal h2{margin:0 0 12px;font-size:19px}
.modal textarea{width:100%;min-height:130px;font-size:20px;resize:vertical}
.swatches{display:flex;gap:10px;margin:12px 0}
.swatch{width:40px;height:40px;border-radius:10px;border:2px solid transparent;padding:0;box-shadow:var(--shadow)}
.swatch.sel{border-color:var(--ink);transform:scale(1.08)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.modal .actions .left{margin-right:auto}
.counter{font-size:12px;color:var(--sub);text-align:right}
.bignote{border-radius:6px;padding:22px;font-size:26px;min-height:200px;white-space:pre-wrap;word-break:break-all;box-shadow:var(--shadow)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.qrbox .url{font-size:13px;word-break:break-all;color:var(--sub)}
.qrbox #qr{background:#fff;padding:12px}

/* AI要約 */
.sum-overview{font-size:17px;line-height:1.7;background:#f3f6fc;border-radius:12px;padding:14px 16px}
.sum-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:14px 0}
.sum-group{border:1px solid var(--line);border-radius:12px;padding:12px}
.sum-group b{display:block;margin-bottom:6px}
.sum-group ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.sum-sec{margin-top:14px}
.sum-sec h4{margin:0 0 6px;font-size:14px}
.sum-sec ul{margin:0;padding-left:18px;line-height:1.7}
.sum-foot{font-size:12px;color:var(--sub);margin-top:12px}
.spinner{width:42px;height:42px;border:4px solid #dde5f3;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:#22313f;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}

@media (max-width:700px){
  .timer{font-size:22px;min-width:90px;padding:2px 8px}
  .bar .bsub{display:none}
  .question{font-size:14px;padding:6px 10px}
  .note .txt.l{font-size:22px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ============================================================
//  ★ここにGASの「ウェブアプリURL」を貼り付けてください★
//  空のままだと「デモモード」（この端末だけで動く）になります
// ============================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzEv_lA7cAWoxRSD2iAQSroiiSOPrT3j29Zo-6DWQyhtspUxe_RxV_3nB1tXqep-cmC/exec';
const POLL_MS = 3000;   // 画面を更新する間隔（ミリ秒）。重いときは 5000 に

// ===== CORE：ボードの状態を変える共通ルール（GASとブラウザのデモで同じものを使う） =====
var CORE = (function () {
  var BW = 3000, BH = 2000, NW = 180, NH = 180;
  var MAX_NOTES = 500, MAX_TEXT = 140;
  var COLORS = ['yellow', 'pink', 'blue', 'green', 'orange', 'purple'];

  function defaultControl() {
    return {
      stopped: false, stopMsg: '',
      timerEnd: 0, timerTotal: 0, timerPaused: 0,
      voting: false, votesPer: 3, hideVotes: true,
      freeMove: false,
      summary: null, summaryShown: false
    };
  }
  function mergeControl(c) {
    var d = defaultControl();
    if (c && typeof c === 'object') {
      for (var k in d) if (Object.prototype.hasOwnProperty.call(c, k)) d[k] = c[k];
    }
    return d;
  }
  function indexOfNote(state, id) {
    for (var i = 0; i < state.notes.length; i++) if (state.notes[i].id === id) return i;
    return -1;
  }
  function num(v, lo, hi) {
    v = Number(v);
    if (!isFinite(v)) v = lo;
    return Math.max(lo, Math.min(hi, Math.round(v)));
  }
  function str(t, max) {
    t = String(t == null ? '' : t).replace(/\r/g, '');
    return t.length > max ? t.slice(0, max) : t;
  }
  function votesUsed(state, cid) {
    var n = 0;
    for (var i = 0; i < state.notes.length; i++) if (state.notes[i].votes.indexOf(cid) >= 0) n++;
    return n;
  }

  // state = {board:{id,title,question,createdAt,archived,control}, notes:[...], ver}
  // 戻り値 = {ok, error?, upserts:[note], deletes:[id], board:bool, rewrite:bool}
  function apply(state, req, isTeacher, now) {
    var c = state.board.control;
    var out = { ok: true, upserts: [], deletes: [], board: false, rewrite: false };
    function fail(m) { return { ok: false, error: m }; }
    var a = req.action;
    var studentActions = { addNote: 1, updateNote: 1, deleteNote: 1, vote: 1 };
    if (!studentActions[a] && !isTeacher) return fail('先生だけが使える操作です');
    if (studentActions[a] && !isTeacher) {
      if (state.board.archived) return fail('このボードは終了しています');
      if (c.stopped) return fail('いまは先生が作業を止めています');
    }
    var cid = String(req.cid || '');
    var i, n;

    switch (a) {
      case 'addNote': {
        var src = req.note || {};
        var id = str(src.id, 40);
        if (!id) return fail('付箋のIDがありません');
        if (indexOfNote(state, id) >= 0) return out; // 二重送信は無視
        if (state.notes.length >= MAX_NOTES) return fail('このボードの付箋が上限（' + MAX_NOTES + '枚）に達しました');
        var text = str(src.text, MAX_TEXT);
        if (!text.trim()) return fail('空の付箋は貼れません');
        n = {
          id: id, text: text,
          color: COLORS.indexOf(src.color) >= 0 ? src.color : 'yellow',
          x: num(src.x, 0, BW - NW), y: num(src.y, 0, BH - NH),
          author: str(req.name, 20), cid: cid,
          createdAt: now, updatedAt: now, votes: []
        };
        state.notes.push(n);
        out.upserts.push(n);
        return out;
      }
      case 'updateNote': {
        i = indexOfNote(state, req.id);
        if (i < 0) return fail('この付箋は削除されています');
        n = state.notes[i];
        var own = n.cid === cid;
        var canEdit = isTeacher || own;
        var canMove = canEdit || c.freeMove;
        var p = req.patch || {};
        if ((p.text !== undefined || p.color !== undefined) && !canEdit) return fail('自分の付箋だけ書きかえられます');
        if ((p.x !== undefined || p.y !== undefined) && !canMove) return fail('自分の付箋だけ動かせます');
        if (p.text !== undefined) {
          var t = str(p.text, MAX_TEXT);
          if (!t.trim()) return fail('空の付箋にはできません');
          n.text = t;
        }
        if (p.color !== undefined && COLORS.indexOf(p.color) >= 0) n.color = p.color;
        if (p.x !== undefined) n.x = num(p.x, 0, BW - NW);
        if (p.y !== undefined) n.y = num(p.y, 0, BH - NH);
        n.updatedAt = now;
        out.upserts.push(n);
        return out;
      }
      case 'deleteNote': {
        i = indexOfNote(state, req.id);
        if (i < 0) return out;
        if (!isTeacher && state.notes[i].cid !== cid) return fail('自分の付箋だけ消せます');
        state.notes.splice(i, 1);
        out.deletes.push(req.id);
        return out;
      }
      case 'vote': {
        if (!c.voting) return fail('いまは投票の時間ではありません');
        i = indexOfNote(state, req.id);
        if (i < 0) return fail('この付箋は削除されています');
        n = state.notes[i];
        var k = n.votes.indexOf(cid);
        if (k >= 0) n.votes.splice(k, 1);
        else {
          if (votesUsed(state, cid) >= c.votesPer) return fail('持ち票（' + c.votesPer + '票）を使い切りました。取り消すと入れなおせます');
          n.votes.push(cid);
        }
        out.upserts.push(n);
        return out;
      }

      // ---- ここから先生だけ ----
      case 'control': {
        var pt = req.patch || {};
        if (pt.stopped !== undefined) c.stopped = !!pt.stopped;
        if (pt.stopMsg !== undefined) c.stopMsg = str(pt.stopMsg, 60);
        if (pt.voting !== undefined) c.voting = !!pt.voting;
        if (pt.votesPer !== undefined) c.votesPer = num(pt.votesPer, 1, 10);
        if (pt.hideVotes !== undefined) c.hideVotes = !!pt.hideVotes;
        if (pt.freeMove !== undefined) c.freeMove = !!pt.freeMove;
        if (pt.summaryShown !== undefined) c.summaryShown = !!pt.summaryShown;
        out.board = true;
        return out;
      }
      case 'timer': {
        var op = req.op;
        if (op === 'start') {
          var sec = num(req.sec, 1, 3600);
          c.timerTotal = sec * 1000; c.timerEnd = now + sec * 1000; c.timerPaused = 0;
        } else if (op === 'pause') {
          if (c.timerEnd > now) { c.timerPaused = c.timerEnd - now; c.timerEnd = 0; }
        } else if (op === 'resume') {
          if (c.timerPaused > 0) { c.timerEnd = now + c.timerPaused; c.timerPaused = 0; }
        } else if (op === 'add') {
          var add = num(req.sec, 1, 3600) * 1000;
          if (c.timerEnd > now) { c.timerEnd += add; c.timerTotal += add; }
          else if (c.timerPaused > 0) { c.timerPaused += add; c.timerTotal += add; }
          else { c.timerEnd = now + add; c.timerTotal = add; c.timerPaused = 0; }
        } else if (op === 'reset') {
          c.timerEnd = 0; c.timerTotal = 0; c.timerPaused = 0;
        } else return fail('タイマーの操作が不明です');
        out.board = true;
        return out;
      }
      case 'info': {
        if (req.title !== undefined) state.board.title = str(req.title, 60) || state.board.title;
        if (req.question !== undefined) state.board.question = str(req.question, 200);
        out.board = true;
        return out;
      }
      case 'archive': {
        state.board.archived = !!req.archived;
        out.board = true;
        return out;
      }
      case 'resetVotes': {
        for (i = 0; i < state.notes.length; i++) state.notes[i].votes = [];
        out.rewrite = true;
        return out;
      }
      case 'clearNotes': {
        state.notes = [];
        out.rewrite = true;
        return out;
      }
      case 'setSummary': {
        c.summary = req.summary || null;
        c.summaryShown = false;
        out.board = true;
        return out;
      }
    }
    return fail('不明な操作です: ' + a);
  }

  return {
    BW: BW, BH: BH, NW: NW, NH: NH, MAX_TEXT: MAX_TEXT, COLORS: COLORS,
    defaultControl: defaultControl, mergeControl: mergeControl, apply: apply, votesUsed: votesUsed
  };
})();


// ---------------- 共通 ----------------
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const {BW, BH, NW, NH} = CORE;
const COLOR_NAMES = {yellow:'きいろ', pink:'ピンク', blue:'あお', green:'みどり', orange:'オレンジ', purple:'むらさき'};
function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function rid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
function fmtTime(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function hhmm(t) { const d = new Date(t); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const S = {
  role: 'student', pass: '', name: ls('jb_name') || '', cid: ls('jb_cid') || '',
  boardId: null, state: null, ver: '', offset: 0,
  z: .8, px: 0, py: 0, locks: {}, gone: {},
  pollTimer: null, tickTimer: null, connOk: true,
  lastColor: ls('jb_color') || 'yellow', lastSumAt: 0, chimedFor: 0, warnedMove: false
};
if (!S.cid) { S.cid = rid('c'); ls('jb_cid', S.cid); }

// ---------------- 通信（GAS or デモ） ----------------
async function apiGet(params) {
  if (!GAS_URL) return Demo.get(params);
  const r = await fetch(GAS_URL + '?' + new URLSearchParams(params));
  return r.json();
}
async function api(req) {
  req.cid = S.cid; req.name = S.name;
  if (S.role === 'teacher') req.pass = S.pass;
  if (!GAS_URL) return Demo.post(req);
  const r = await fetch(GAS_URL, {method: 'POST', body: JSON.stringify(req)});
  return r.json();
}

// デモモード：この端末のブラウザ内だけで動く（タブを2つ開くと先生と生徒を試せます）
const Demo = {
  db() { try { return JSON.parse(localStorage.getItem('jb_demo') || '{"boards":{}}'); } catch (e) { return {boards: {}}; } },
  save(db) { try { localStorage.setItem('jb_demo', JSON.stringify(db)); } catch (e) {} },
  wait(v) { return new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(v))), 60)); },
  meta(b) { return {id: b.id, title: b.title, question: b.question, createdAt: b.createdAt, archived: b.archived}; },
  get(p) {
    const db = this.db();
    if (p.action === 'boards') return this.wait({ok: true, boards: Object.values(db.boards).filter(s => !s.board.archived).map(s => this.meta(s.board)).sort((a, b) => b.createdAt - a.createdAt)});
    if (p.action === 'state') {
      const st = db.boards[p.b];
      if (!st) return this.wait({ok: false, error: 'ボードが見つかりません'});
      if (p.v && String(st.ver) === String(p.v)) return this.wait({ok: true, same: true, now: Date.now()});
      return this.wait({ok: true, state: st, now: Date.now()});
    }
    return this.wait({ok: false, error: '不明'});
  },
  post(req) {
    const db = this.db(), now = Date.now(), teacher = !!req.pass;
    if (req.action === 'login') return this.wait({ok: true});
    if (req.action === 'listBoards') return this.wait({ok: true, boards: Object.values(db.boards).map(s => this.meta(s.board)).sort((a, b) => b.createdAt - a.createdAt)});
    if (req.action === 'createBoard') {
      const id = rid('B');
      const board = {id, title: (req.title || '新しいボード').slice(0, 60), question: (req.question || '').slice(0, 200), createdAt: now, archived: false, control: CORE.defaultControl()};
      db.boards[id] = {board, notes: [], ver: now};
      this.save(db);
      return this.wait({ok: true, board: this.meta(board)});
    }
    if (req.action === 'deleteBoard') { delete db.boards[req.b]; this.save(db); return this.wait({ok: true}); }
    const st = db.boards[req.b];
    if (!st) return this.wait({ok: false, error: 'ボードが見つかりません'});
    if (req.action === 'summarize') {
      if (!st.notes.length) return this.wait({ok: false, error: '付箋がまだありません'});
      req = {action: 'setSummary', summary: this.fakeSummary(st)};
    }
    const res = CORE.apply(st, req, teacher, now);
    if (!res.ok) return this.wait(res);
    st.ver = Math.max(now, Number(st.ver) + 1);
    this.save(db);
    const out = {ok: true, ver: st.ver, now};
    if (teacher) out.state = st;
    if (req.action === 'setSummary') out.summary = st.board.control.summary;
    return new Promise(r => setTimeout(() => r(JSON.parse(JSON.stringify(out))), req.action === 'setSummary' ? 900 : 60));
  },
  fakeSummary(st) {
    const by = {};
    st.notes.forEach(n => (by[n.color] = by[n.color] || []).push(n));
    const groups = Object.keys(by).map(c => ({label: COLOR_NAMES[c] + 'の付箋', count: by[c].length, points: by[c].slice(0, 3).map(n => n.text.slice(0, 40))}));
    const top = st.notes.slice().sort((a, b) => b.votes.length - a.votes.length)[0];
    return {
      overview: '【デモモード】これはAIではなく、色ごとに並べた仮のまとめです。GASにつなぎAPIキーを設定すると、Claudeが付箋' + st.notes.length + '枚の内容を読んで要約します。',
      groups, unique: top && top.votes.length ? ['いちばん票を集めたのは「' + top.text.slice(0, 30) + '」'] : [],
      questions: ['（AIにつなぐと、ここに「次に考えたい問い」が出ます）'], at: Date.now(), count: st.notes.length
    };
  }
};

// ---------------- 音楽（その場で音を合成：著作権の心配なし） ----------------
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const Music = {
  ctx: null, master: null, bus: null, loop: null, vol: .6, track: '', audioEl: null, _noise: null,
  ensure() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    if (!this.ctx) {
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = this.vol;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return true;
  },
  noise() {
    if (this._noise) return this._noise;
    const len = this.ctx.sampleRate * 2, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return this._noise = b;
  },
  setVolume(v) {
    this.vol = v;
    if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, .05);
    if (this.audioEl) this.audioEl.volume = Math.min(1, v);
  },
  stop(fade = .8) {
    if (this.loop) { clearInterval(this.loop); this.loop = null; }
    if (this.bus && this.ctx) {
      const b = this.bus, t = this.ctx.currentTime;
      b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(b.gain.value, t); b.gain.linearRampToValueAtTime(0, t + fade);
      setTimeout(() => { (b._long || []).forEach(n => { try { n.stop(); } catch (e) {} }); try { b.disconnect(); } catch (e) {} }, fade * 1000 + 120);
    }
    this.bus = null;
    if (this.audioEl) this.audioEl.pause();
    this.track = '';
  },
  play(track) {
    this.stop(.3);
    if (track === 'file') {
      if (!this.audioEl) return false;
      this.audioEl.loop = true; this.audioEl.volume = Math.min(1, this.vol); this.audioEl.currentTime = 0;
      this.audioEl.play().catch(() => toast('音源を再生できませんでした'));
      this.track = 'file'; return true;
    }
    if (!this.ensure()) return false;
    const ctx = this.ctx, bus = ctx.createGain(), t = ctx.currentTime;
    bus.gain.setValueAtTime(0, t); bus.gain.linearRampToValueAtTime(1, t + 1.5);
    bus.connect(this.master); bus._long = [];
    this.bus = bus; this.track = track;
    this['_' + track](bus);
    return true;
  },
  _rain(bus) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource(); src.buffer = this.noise(); src.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 180;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100;
    const g = ctx.createGain(); g.gain.value = .4;
    src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(bus); src.start();
    const lfo = ctx.createOscillator(); lfo.frequency.value = .07; const lg = ctx.createGain(); lg.gain.value = .1;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    bus._long.push(src, lfo);
    this.loop = setInterval(() => {
      const now = ctx.currentTime;
      for (let i = 0; i < 3; i++) if (Math.random() < .55) this.drop(bus, now + Math.random() * .1);
    }, 100);
  },
  drop(bus, when) {
    const ctx = this.ctx, s = ctx.createBufferSource(); s.buffer = this.noise();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800 + Math.random() * 3500; bp.Q.value = 6;
    const g = ctx.createGain(), peak = .05 + Math.random() * .12;
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(peak, when + .003);
    g.gain.exponentialRampToValueAtTime(.0001, when + .05 + Math.random() * .05);
    s.connect(bp); bp.connect(g); g.connect(bus); s.start(when, Math.random() * 1.5, .12);
  },
  pad(dest, midi, t, len, vol, type = 'triangle') {
    const ctx = this.ctx;
    [-5, 5].forEach(det => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = mtof(midi); o.detune.value = det;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(1.8, len * .3));
      g.gain.setValueAtTime(vol, t + len * .6); g.gain.linearRampToValueAtTime(0, t + len);
      o.connect(g); g.connect(dest); o.start(t); o.stop(t + len + .05);
    });
  },
  bell(dest, midi, t, vol, decay = 2.5) {
    const ctx = this.ctx, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = mtof(midi);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + decay);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + decay + .05);
  },
  _ambient(bus) {
    const ctx = this.ctx;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400;
    const delay = ctx.createDelay(1.5); delay.delayTime.value = .42;
    const fb = ctx.createGain(); fb.gain.value = .38; const wet = ctx.createGain(); wet.gain.value = .35;
    lp.connect(bus); lp.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(bus);
    const chords = [[48, 55, 64, 71], [45, 52, 60, 67], [41, 48, 57, 64], [43, 50, 59, 62]];
    const pent = [72, 74, 76, 79, 81, 84];
    let next = ctx.currentTime + .1, ci = 0; const dur = 6;
    const sched = () => {
      while (next < ctx.currentTime + .6) {
        chords[ci % chords.length].forEach(m => this.pad(lp, m, next, dur + 1.5, .05));
        for (let k = 0; k < 3; k++) if (Math.random() < .7) this.bell(lp, pent[Math.floor(Math.random() * pent.length)], next + Math.random() * dur, .045);
        next += dur; ci++;
      }
    };
    sched(); this.loop = setInterval(sched, 200);
  },
  _beat(bus) {
    const ctx = this.ctx, s16 = 60 / 78 / 4;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 950; lp.connect(bus);
    const crack = ctx.createBufferSource(); crack.buffer = this.noise(); crack.loop = true;
    const cf = ctx.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 2500; cf.Q.value = .5;
    const cg = ctx.createGain(); cg.gain.value = .012; crack.connect(cf); cf.connect(cg); cg.connect(bus); crack.start(); bus._long.push(crack);
    const chords = [[57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 65], [52, 55, 59, 62]];
    const roots = [45, 41, 43, 40];
    let next = ctx.currentTime + .1, step = 0, bar = 0;
    const kick = t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(45, t + .12);
      g.gain.setValueAtTime(.55, t); g.gain.exponentialRampToValueAtTime(.001, t + .32); o.connect(g); g.connect(bus); o.start(t); o.stop(t + .35); };
    const snare = t => { const n = ctx.createBufferSource(); n.buffer = this.noise(); const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = .8;
      const g = ctx.createGain(); g.gain.setValueAtTime(.16, t); g.gain.exponentialRampToValueAtTime(.001, t + .16); n.connect(f); f.connect(g); g.connect(bus); n.start(t, Math.random(), .2); };
    const hat = (t, v) => { const n = ctx.createBufferSource(); n.buffer = this.noise(); const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
      const g = ctx.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + .045); n.connect(f); f.connect(g); g.connect(bus); n.start(t, Math.random(), .06); };
    const bass = (t, m) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = mtof(m);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.22, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + 1.3); o.connect(g); g.connect(bus); o.start(t); o.stop(t + 1.35); };
    const sched = () => {
      while (next < ctx.currentTime + .15) {
        const t = next + (step % 2 ? .035 : 0); // スウィング
        const ci = bar % 4;
        if (step === 0) { chords[ci].forEach(m => this.pad(lp, m, t, s16 * 16, .03)); bass(t, roots[ci]); }
        if (step === 8) bass(t, roots[ci]);
        if (step === 0 || step === 10) kick(t);
        if (step === 4 || step === 12) snare(t);
        if (step % 2 === 0) hat(t, step % 4 === 2 ? .05 : .025);
        if (step === 6 && Math.random() < .5) this.bell(lp, chords[ci][Math.floor(Math.random() * 4)] + 12, t, .04, 1.2);
        next += s16; step = (step + 1) % 16; if (step === 0) bar++;
      }
    };
    sched(); this.loop = setInterval(sched, 25);
  },
  chime() {
    if (!this.ensure()) return;
    const t = this.ctx.currentTime;
    [[84, 0], [88, .28], [91, .56]].forEach(([m, d]) => this.bell(this.master, m, t + d, .35, 1.8));
  }
};

      <div class="stop-banner hidden" id="stopBanner">✋ 生徒の画面を止めています</div>
      <div class="vp" id="vp"><div class="board" id="board" style="width:${BW}px;height:${BH}px"></div></div>
      <div class="fab"><button class="primary" id="addBtn" disabled>＋ 付箋</button></div>
      <div class="zoom"><button id="zOut">−</button><button id="zFit" title="全体を見る">⤢</button><button id="zIn">＋</button></div>
      <div class="hint" id="hint">ボードを2回タップしても付箋を貼れます</div>
      ${T ? teacherPanelHTML() : ''}
    </div>
  </div>
  <div class="stopov hidden" id="stopov"><div class="hand">✋</div><div class="msg" id="stopMsg"></div><div class="small">先生の合図があるまで待ってね</div></div>`;

  $('#back').onclick = () => T ? showTeacherHome() : showStudentHome();
  $('#addBtn').onclick = () => { const c = viewCenter(); openEditor(null, freeSpot(c.x - NW / 2, c.y - NH / 2)); };
  $('#zIn').onclick = () => zoomAt(null, 1.25);
  $('#zOut').onclick = () => zoomAt(null, 1 / 1.25);
  $('#zFit').onclick = fitView;
  $('#sumBtn').onclick = () => showSummary(S.state && S.state.board.control.summary);
  setTimeout(() => { const h = $('#hint'); if (h) h.style.display = 'none'; }, 7000);
  setupGestures();
  if (T) setupTeacherPanel();
  window.addEventListener('resize', onResize);

  try {
    const r = await apiGet({action: 'state', b: id});
    if (!r.ok) { toast(r.error); return T ? showTeacherHome() : showStudentHome(); }
    S.offset = r.now - Date.now(); S.ver = r.state.ver;
    mergeState(r.state);
    fitView(); renderAll();
  } catch (e) { toast('通信エラー：' + e.message); }
  S.pollTimer = setTimeout(poll, POLL_MS);
  S.tickTimer = setInterval(tick, 250);
}

async function poll() {
  if (!S.boardId) return;
  const myBoard = S.boardId;
  try {
    const r = await apiGet({action: 'state', b: S.boardId, v: S.ver});
    if (myBoard !== S.boardId) return;
    setConn(true);
    if (r.ok) {
      S.offset = r.now - Date.now();
      if (!r.same) { S.ver = r.state.ver; mergeState(r.state); renderAll(); }
    } else if (r.error) { toast(r.error); }
  } catch (e) { setConn(false); }
  if (myBoard === S.boardId) S.pollTimer = setTimeout(poll, POLL_MS + Math.random() * 800);
}

function setConn(ok) { S.connOk = ok; const c = $('#conn'); if (c) c.classList.toggle('bad', !ok); }

// サーバーの状態と、手元で操作中の付箋をまぜる
function mergeState(ns) {
  const now = Date.now();
  const local = new Map((S.state ? S.state.notes : []).map(n => [n.id, n]));
  const notes = ns.notes.filter(n => !(S.gone[n.id] > now)).map(n => (S.locks[n.id] > now && local.has(n.id)) ? local.get(n.id) : n);
  const ids = new Set(notes.map(n => n.id));
  for (const [id, n] of local) if (S.locks[id] > now && !ids.has(id)) notes.push(n);
  ns.notes = notes;
  S.state = ns;
}
function lock(id) { S.locks[id] = Date.now() + 9000; }
function handle(r) {
  if (!r || !r.ok) { toast((r && r.error) || 'うまくいきませんでした'); return false; }
  if (r.state) { S.ver = r.state.ver; mergeState(r.state); renderAll(); }
  return true;
}

// ---------------- 表示 ----------------
function renderAll() { if (!S.state) return; renderHeader(); renderNotes(); renderStop(); renderSummaryBtn(); if (S.role === 'teacher') renderPanel(); }

function renderHeader() {
  const b = S.state.board, c = b.control;
  $('#btitle').textContent = b.title;
  $('#question').textContent = b.question ? '問い：' + b.question : '';
  const authors = new Set(S.state.notes.map(n => n.cid));
  $('#bsub').textContent = `付箋 ${S.state.notes.length}枚・${authors.size}人` + (b.archived ? '（終了したボード）' : '');
  const vl = $('#votesLeft');
  if (c.voting) {
    const left = c.votesPer - CORE.votesUsed(S.state, S.cid);
    vl.style.display = ''; vl.textContent = S.role === 'teacher' ? `⭐ 投票中（1人${c.votesPer}票）` : `⭐ のこり ${left} 票`;
  } else vl.style.display = 'none';
  $('#addBtn').disabled = b.archived && S.role !== 'teacher';
  tick();
}

function noteSizeClass(t) { const l = t.length; return l <= 18 ? 'l' : l <= 60 ? 'm' : 's'; }

function renderNotes() {
  const board = $('#board'); if (!board) return;
  const c = S.state.board.control, T = S.role === 'teacher';
  const showCount = T || !c.voting || !c.hideVotes;
  const totalVotes = S.state.notes.reduce((a, n) => a + n.votes.length, 0);
  // 投票が終わったら上位3位にバッジ
  const rank = {};
  if (!c.voting && totalVotes > 0) {
    const counts = [...new Set(S.state.notes.map(n => n.votes.length).filter(v => v > 0))].sort((a, b) => b - a).slice(0, 3);
    S.state.notes.forEach(n => { const k = counts.indexOf(n.votes.length); if (n.votes.length > 0 && k >= 0) rank[n.id] = k + 1; });
  }
  const seen = new Set();
  S.state.notes.forEach(n => {
    seen.add(n.id);
    let el = board.querySelector(`.note[data-id="${CSS.escape(n.id)}"]`);
    if (!el) {
      el = document.createElement('div');
      el.className = 'note'; el.dataset.id = n.id;
      el.innerHTML = '<div class="txt"></div><div class="meta"><span class="who"></span><button class="vote"></button></div>';
      el.querySelector('.vote').addEventListener('click', ev => { ev.stopPropagation(); vote(n.id); });
      board.appendChild(el);
    }
    if (!el.classList.contains('dragging')) { el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; }
    el.className = 'note c-' + n.color + (n.cid === S.cid ? ' mine' : '') + (el.classList.contains('dragging') ? ' dragging' : '');
    const tx = el.querySelector('.txt');
    if (tx.textContent !== n.text) tx.textContent = n.text;
    tx.className = 'txt ' + noteSizeClass(n.text);
    el.querySelector('.who').textContent = n.author;
    const vb = el.querySelector('.vote');
    const mine = n.votes.includes(S.cid);
    const show = c.voting || totalVotes > 0;
    vb.className = 'vote' + (show ? ' show' : '') + (mine ? ' mine' : '');
    vb.disabled = !c.voting;
    vb.textContent = showCount ? '★ ' + n.votes.length : (mine ? '★ 投票ずみ' : '☆ 投票');
    let rk = el.querySelector('.rank');
    if (rank[n.id]) { if (!rk) { rk = document.createElement('div'); rk.className = 'rank'; el.appendChild(rk); } rk.textContent = rank[n.id] + '位'; }
    else if (rk) rk.remove();
  });
  board.querySelectorAll('.note').forEach(el => { if (!seen.has(el.dataset.id)) el.remove(); });
}

function renderStop() {
  const c = S.state.board.control;
  if (S.role === 'teacher') { $('#stopBanner').classList.toggle('hidden', !c.stopped); return; }
  $('#stopov').classList.toggle('hidden', !c.stopped);
  $('#stopMsg').textContent = c.stopMsg || '手を止めて、前を見てください';
  if (c.stopped) { closeModal(); cancelGesture(); }
}

function renderSummaryBtn() {
  const c = S.state.board.control, btn = $('#sumBtn');
  if (S.role === 'teacher') { btn.style.display = 'none'; return; }
  const show = c.summaryShown && c.summary;
  btn.style.display = show ? '' : 'none';
  // 付箋を書いている途中は勝手に開かない（ボタンから見られる）
  if (show && c.summary.at !== S.lastSumAt && !c.stopped && !modalEl) { S.lastSumAt = c.summary.at; showSummary(c.summary); }
}

function tick() {
  if (!S.state) return;
  const c = S.state.board.control, el = $('#timer'), pg = $('#tprog');
  if (!el) return;
  const now = Date.now() + S.offset;
  const running = c.timerEnd > 0, paused = !running && c.timerPaused > 0;
  if (!running && !paused) { el.className = 'timer hidden'; pg.style.display = 'none'; return; }
  const remain = running ? c.timerEnd - now : c.timerPaused;
  pg.style.display = '';
  pg.firstElementChild.style.width = (c.timerTotal ? clamp(remain / c.timerTotal, 0, 1) * 100 : 0) + '%';
  if (running && remain <= 0) {
    el.className = 'timer done'; el.textContent = '⏰ 時間です';
    if (S.role === 'teacher' && S.chimedFor !== c.timerEnd) {
      S.chimedFor = c.timerEnd; Music.chime();
      const auto = $('#autoStopMusic'); if (auto && auto.checked && Music.track) { Music.stop(2); renderPanel(); }
    }
    return;
  }
  el.className = 'timer' + (paused ? ' paused' : '') + (remain <= 30000 ? ' low' : '');
  el.textContent = (paused ? '⏸ ' : '') + fmtTime(remain);
}

// ---------------- 視点（ズーム・移動） ----------------
function applyView() { const b = $('#board'); if (b) b.style.transform = `translate(${S.px}px,${S.py}px) scale(${S.z})`; }
function vpRect() { return $('#vp').getBoundingClientRect(); }
function toBoard(cx, cy) { const r = vpRect(); return {x: (cx - r.left - S.px) / S.z, y: (cy - r.top - S.py) / S.z}; }
function viewCenter() { const r = vpRect(); return toBoard(r.left + r.width / 2, r.top + r.height / 2); }
function zoomAt(pt, f) {
  const r = vpRect(); const cx = pt ? pt.x : r.left + r.width / 2, cy = pt ? pt.y : r.top + r.height / 2;
  const bx = (cx - r.left - S.px) / S.z, by = (cy - r.top - S.py) / S.z;
  S.z = clamp(S.z * f, .25, 2.2);
  S.px = cx - r.left - bx * S.z; S.py = cy - r.top - by * S.z; applyView();
}
function fitView() {
  if (!S.state) return;
  const r = vpRect(), ns = S.state.notes;
  let x0, y0, x1, y1;
  if (ns.length) {
    x0 = Math.min(...ns.map(n => n.x)) - 60; y0 = Math.min(...ns.map(n => n.y)) - 60;
    x1 = Math.max(...ns.map(n => n.x + NW)) + 60; y1 = Math.max(...ns.map(n => n.y + NH)) + 80;
  } else { x0 = BW / 2 - 520; y0 = BH / 2 - 380; x1 = BW / 2 + 520; y1 = BH / 2 + 380; }
  S.z = clamp(Math.min(r.width / (x1 - x0), r.height / (y1 - y0)), .3, 1.1);
  S.px = (r.width - (x1 - x0) * S.z) / 2 - x0 * S.z;
  S.py = (r.height - (y1 - y0) * S.z) / 2 - y0 * S.z;
  applyView();
}
function onResize() { applyView(); }
// 画面の中央付近で、ほかの付箋と重ならない場所をさがす
function freeSpot(x0, y0) {
  const ns = S.state ? S.state.notes : [];
  const free = (x, y) => ns.every(n => Math.abs(n.x - x) > NW - 10 || Math.abs(n.y - y) > NH - 10);
  const step = NW + 16;
  for (let ring = 0; ring < 12; ring++) {
    const cand = [];
    for (let i = -ring; i <= ring; i++) for (let j = -ring; j <= ring; j++) {
      if (Math.max(Math.abs(i), Math.abs(j)) !== ring) continue;
      const x = clamp(x0 + i * step, 0, BW - NW), y = clamp(y0 + j * step, 0, BH - NH);
      if (free(x, y)) cand.push({x, y});
    }
    if (cand.length) { const c = cand[Math.floor(Math.random() * cand.length)]; return {x: c.x + Math.random() * 16 - 8, y: c.y + Math.random() * 16 - 8}; }
  }
  return {x: x0 + Math.random() * 80 - 40, y: y0 + Math.random() * 80 - 40};
}

// ---------------- 指・マウス操作 ----------------
let G = null; const P = new Map(); let lastTap = null;
function cancelGesture() {
  if (G && G.type === 'note') { const el = G.el; el.classList.remove('dragging'); const n = findNote(G.id); if (n) { n.x = G.ox; n.y = G.oy; el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; } }
  G = null; P.clear(); const vp = $('#vp'); if (vp) vp.classList.remove('grabbing');
}
function findNote(id) { return S.state && S.state.notes.find(n => n.id === id); }
function canEdit(n) { return S.role === 'teacher' || n.cid === S.cid; }
function canMove(n) { return canEdit(n) || (S.state.board.control.freeMove && !S.state.board.archived); }
function blocked() { const c = S.state && S.state.board.control; return S.role !== 'teacher' && (!S.state || c.stopped || S.state.board.archived); }

function setupGestures() {
  const vp = $('#vp');
  vp.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    try { vp.setPointerCapture(e.pointerId); } catch (_) {}
    P.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (P.size === 2) {
      if (G && G.type === 'note') { cancelGesture(); P.set(e.pointerId, {x: e.clientX, y: e.clientY}); }
      const [a, b] = [...P.values()];
      G = {type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: S.z, m0: {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}, px0: S.px, py0: S.py};
      return;
    }
    if (P.size > 2) return;
    const nel = e.target.closest('.note');
    if (nel && S.state) {
      const n = findNote(nel.dataset.id); if (!n) return;
      G = {type: 'note', id: n.id, el: nel, sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y, moved: false};
    } else {
      G = {type: 'pan', sx: e.clientX, sy: e.clientY, px0: S.px, py0: S.py, moved: false};
      vp.classList.add('grabbing');
    }
  });
  vp.addEventListener('pointermove', e => {
    if (!P.has(e.pointerId)) return;
    P.set(e.pointerId, {x: e.clientX, y: e.clientY});
    if (!G) return;
    if (G.type === 'pinch' && P.size >= 2) {
      const [a, b] = [...P.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y), m = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
      const r = vpRect();
      const bx = (G.m0.x - r.left - G.px0) / G.z0, by = (G.m0.y - r.top - G.py0) / G.z0;
      S.z = clamp(G.z0 * d / G.d0, .25, 2.2);
      S.px = m.x - r.left - bx * S.z; S.py = m.y - r.top - by * S.z; applyView();
      return;
    }
    const dx = e.clientX - G.sx, dy = e.clientY - G.sy;
    if (!G.moved && Math.hypot(dx, dy) > 6) G.moved = true;
    if (!G.moved) return;
    if (G.type === 'pan') { S.px = G.px0 + dx; S.py = G.py0 + dy; applyView(); }
    if (G.type === 'note') {
      const n = findNote(G.id);
      if (!n || blocked() || !canMove(n)) {
        if (!S.warnedMove && n && !blocked()) { toast('自分の付箋だけ動かせます'); S.warnedMove = true; }
        return;
      }
      n.x = clamp(Math.round(G.ox + dx / S.z), 0, BW - NW); n.y = clamp(Math.round(G.oy + dy / S.z), 0, BH - NH);
      lock(n.id);
      G.el.classList.add('dragging'); G.el.style.left = n.x + 'px'; G.el.style.top = n.y + 'px';
    }
  });
  const end = (e, cancelled) => {
    if (!P.has(e.pointerId)) return;
    P.delete(e.pointerId);
    vp.classList.remove('grabbing');
    if (!G) return;
    if (G.type === 'pinch') { if (P.size < 2) G = null; return; }
    const g = G; G = null;
    if (cancelled) { if (g.type === 'note') { g.el.classList.remove('dragging'); } return; }
    if (g.type === 'note') {
      g.el.classList.remove('dragging');
      const n = findNote(g.id); if (!n) return;
      if (g.moved) {
        if (n.x !== g.ox || n.y !== g.oy) {
          lock(n.id);
          api({action: 'updateNote', b: S.boardId, id: n.id, patch: {x: n.x, y: n.y}}).then(r => { if (!r.ok) { n.x = g.ox; n.y = g.oy; delete S.locks[n.id]; renderNotes(); toast(r.error); } }).catch(() => toast('通信エラー'));
        }
      } else onNoteTap(n);
    } else if (g.type === 'pan' && !g.moved) {
      const now = Date.now();
      if (lastTap && now - lastTap.t < 380 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) {
        lastTap = null;
        const p = toBoard(e.clientX, e.clientY);
        openEditor(null, {x: p.x - NW / 2, y: p.y - NH / 2});
      } else lastTap = {t: now, x: e.clientX, y: e.clientY};
    }
  };
  vp.addEventListener('pointerup', e => end(e, false));
  vp.addEventListener('pointercancel', e => end(e, true));
  vp.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) zoomAt({x: e.clientX, y: e.clientY}, Math.exp(-e.deltaY * .01));
    else { S.px -= e.deltaX; S.py -= e.deltaY; applyView(); }
  }, {passive: false});
}

// ---------------- 付箋の操作 ----------------
function onNoteTap(n) {
  if (canEdit(n) && !blocked()) openEditor(n);
  else openViewer(n);
}

let modalEl = null;
function openModal(html, cls = '') {
  closeModal();
  modalEl = document.createElement('div');
  modalEl.className = 'modal-bg';
  modalEl.innerHTML = `<div class="modal ${cls}">${html}</div>`;
  modalEl.addEventListener('pointerdown', e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  return modalEl.firstElementChild;
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; } }

function openViewer(n) {
  const m = openModal(`<div class="bignote c-${n.color}">${esc(n.text)}</div>
    <p class="muted" style="margin:10px 0 0">${esc(n.author)}・★${n.votes.length}</p>
    <div class="actions"><button id="cl">とじる</button></div>`);
  $('#cl', m).onclick = closeModal;
}

function openEditor(n, pos) {
  if (!S.state) return;
  if (blocked()) { toast(S.state.board.archived ? 'このボードは終了しています' : 'いまは先生が作業を止めています'); return; }
  const isNew = !n;
  let color = isNew ? S.lastColor : n.color;
  const m = openModal(`
    <h2>${isNew ? '付箋を書く' : '付箋をなおす'}</h2>
    <textarea id="tx" maxlength="${CORE.MAX_TEXT}" placeholder="考えたことを書こう">${isNew ? '' : esc(n.text)}</textarea>
    <div class="counter"><span id="cnt">0</span> / ${CORE.MAX_TEXT}</div>
    <div class="swatches">${CORE.COLORS.map(c => `<button class="swatch c-${c}${c === color ? ' sel' : ''}" data-c="${c}" title="${COLOR_NAMES[c]}"></button>`).join('')}</div>
    <div class="actions">
      ${isNew ? '' : '<button class="danger left" id="del">削除</button>'}
      <button id="cancel">キャンセル</button><button class="primary" id="save">${isNew ? '貼る' : '保存'}</button>
    </div>`);
  const tx = $('#tx', m), cnt = $('#cnt', m);
  const upd = () => cnt.textContent = tx.value.length; upd();
  tx.oninput = upd;
  setTimeout(() => tx.focus(), 50);
  $('.swatches', m).onclick = e => {
    const b = e.target.closest('.swatch'); if (!b) return;
    color = b.dataset.c; m.querySelectorAll('.swatch').forEach(s => s.classList.toggle('sel', s === b));
  };
  $('#cancel', m).onclick = closeModal;
  tx.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('#save', m).click(); };
  if (!isNew) $('#del', m).onclick = () => {
    if (!confirm('この付箋を消しますか？')) return;
    closeModal();
    const idx = S.state.notes.indexOf(n); if (idx >= 0) S.state.notes.splice(idx, 1);
    S.gone[n.id] = Date.now() + 9000; renderAll();
    api({action: 'deleteNote', b: S.boardId, id: n.id}).then(r => { if (!r.ok) { delete S.gone[n.id]; S.state.notes.push(n); renderAll(); toast(r.error); } }).catch(() => toast('通信エラー'));
  };
  $('#save', m).onclick = () => {
    const text = tx.value.replace(/\s+$/, '');
    if (!text.trim()) { toast('何か書いてね'); return; }
    S.lastColor = color; ls('jb_color', color);
    closeModal();
    if (isNew) {
      const note = {id: rid('n'), text, color, x: clamp(Math.round(pos.x), 0, BW - NW), y: clamp(Math.round(pos.y), 0, BH - NH),
        author: S.name, cid: S.cid, createdAt: Date.now(), updatedAt: Date.now(), votes: []};
      S.state.notes.push(note); lock(note.id); renderAll();
      api({action: 'addNote', b: S.boardId, note: {id: note.id, text, color, x: note.x, y: note.y}})
        .then(r => { if (!r.ok) { S.state.notes = S.state.notes.filter(x => x.id !== note.id); delete S.locks[note.id]; renderAll(); toast(r.error); } })
        .catch(() => toast('通信エラー：もう一度ためしてね'));
    } else {
      const old = {text: n.text, color: n.color};
      n.text = text; n.color = color; lock(n.id); renderAll();
      api({action: 'updateNote', b: S.boardId, id: n.id, patch: {text, color}})
        .then(r => { if (!r.ok) { Object.assign(n, old); delete S.locks[n.id]; renderAll(); toast(r.error); } })
        .catch(() => toast('通信エラー'));
    }
  };
}

function vote(id) {
  const c = S.state.board.control, n = findNote(id);
  if (!n || !c.voting) return;
  if (blocked()) { toast('いまは先生が作業を止めています'); return; }
  const i = n.votes.indexOf(S.cid);
  if (i >= 0) n.votes.splice(i, 1);
  else {
    if (CORE.votesUsed(S.state, S.cid) >= c.votesPer) { toast('持ち票を使い切りました。取り消すと入れなおせます'); return; }
    n.votes.push(S.cid);
  }
  lock(id); renderAll();
  api({action: 'vote', b: S.boardId, id}).then(r => {
    if (!r.ok) { const k = n.votes.indexOf(S.cid); if (i >= 0 && k < 0) n.votes.push(S.cid); if (i < 0 && k >= 0) n.votes.splice(k, 1); delete S.locks[id]; renderAll(); toast(r.error); }
  }).catch(() => toast('通信エラー'));
}

// ---------------- AI要約の表示 ----------------
function summaryHTML(s) {
  const li = a => (a || []).map(x => `<li>${esc(x)}</li>`).join('');
  return `
    <div class="sum-overview">${esc(s.overview || '')}</div>
    ${(s.groups || []).length ? `<div class="sum-groups">${s.groups.map(g => `<div class="sum-group"><b>${esc(g.label)}${g.count ? `<span class="tag">${esc(g.count)}枚</span>` : ''}</b><ul>${li(g.points)}</ul></div>`).join('')}</div>` : ''}
    ${(s.unique || []).length ? `<div class="sum-sec"><h4>💡 少数だけど大事な視点</h4><ul>${li(s.unique)}</ul></div>` : ''}
    ${(s.questions || []).length ? `<div class="sum-sec"><h4>❓ 次に考えたい問い</h4><ul>${li(s.questions)}</ul></div>` : ''}
    <div class="sum-foot">付箋${esc(s.count || '')}枚から作成・${s.at ? hhmm(s.at) : ''}　※AIのまとめです。もとの付箋もあわせて見てください。</div>`;
}
function showSummary(s) {
  if (!s) { toast('まだ要約がありません'); return; }
  const T = S.role === 'teacher', c = S.state.board.control;
  const m = openModal(`<h2>🤖 AIによる全体のまとめ</h2>${summaryHTML(s)}
    <div class="actions">${T ? `<button class="left" id="share">${c.summaryShown ? '生徒の画面から隠す' : '生徒の画面にも表示する'}</button><button id="again">もう一度要約</button>` : ''}<button class="primary" id="cl">とじる</button></div>`, 'wide');
  $('#cl', m).onclick = closeModal;
  if (T) {
    $('#share', m).onclick = async () => { const r = await api({action: 'control', b: S.boardId, patch: {summaryShown: !S.state.board.control.summaryShown}}); if (handle(r)) { closeModal(); toast(S.state.board.control.summaryShown ? '生徒の画面に表示しました' : '生徒の画面から隠しました'); } };
    $('#again', m).onclick = runSummary;
  }
}
async function runSummary() {
  if (!S.state.notes.length) { toast('付箋がまだありません'); return; }
  openModal(`<h2>🤖 要約しています…</h2><div class="spinner"></div><p class="muted" style="text-align:center">付箋${S.state.notes.length}枚を読んでいます（10〜30秒ほど）</p>`);
  try {
    const r = await api({action: 'summarize', b: S.boardId});
    if (!handle(r)) { closeModal(); return; }
    showSummary(r.summary || S.state.board.control.summary);
  } catch (e) { closeModal(); toast('通信エラー：' + e.message); }
}

    </section>
    <section><h3>⏱ タイマー</h3>

function setupTeacherPanel() {
  const panel = $('#panel');
  const ctrl = async patch => handle(await api({action: 'control', b: S.boardId, patch}).catch(e => ({ok: false, error: e.message})));
  const timer = async (op, sec) => { Music.ensure(); handle(await api({action: 'timer', b: S.boardId, op, sec}).catch(e => ({ok: false, error: e.message}))); };
  $('#panelBtn').onclick = () => panel.classList.toggle('open');
  $('#panelClose').onclick = () => panel.classList.remove('open');
  panel.addEventListener('pointerdown', () => Music.ensure(), {once: true});

  $('#stopBtn').onclick = () => { const c = S.state.board.control; ctrl({stopped: !c.stopped, stopMsg: $('#stopMsgIn').value.trim()}); };
  $('#stopMsgIn').onchange = () => ctrl({stopMsg: $('#stopMsgIn').value.trim()});

  panel.querySelectorAll('[data-min]').forEach(b => b.onclick = () => timer('start', +b.dataset.min * 60));
  $('#tStart').onclick = () => { const m = parseFloat($('#tMin').value); if (!(m > 0)) return toast('分数を入れてください'); timer('start', Math.round(m * 60)); };
  $('#tPause').onclick = () => { const c = S.state.board.control; timer(c.timerEnd > 0 ? 'pause' : 'resume'); };
  $('#tAdd').onclick = () => timer('add', 60);
  $('#tReset').onclick = () => timer('reset');

  $('#track').onchange = () => { if ($('#track').value === 'file' && !Music.audioEl) $('#mfile').click(); else if (Music.track) { Music.play($('#track').value); renderPanel(); } };
  $('#mfile').onchange = () => {
    const f = $('#mfile').files[0]; if (!f) return;
    if (Music.audioEl) { Music.audioEl.pause(); URL.revokeObjectURL(Music.audioEl.src); }
    Music.audioEl = new Audio(URL.createObjectURL(f));
    $('#track').querySelector('option[value=file]').textContent = '🎧 ' + f.name.slice(0, 24);
    Music.play('file'); renderPanel();
  };
  $('#playBtn').onclick = () => {
    if (Music.track) Music.stop();
    else {
      const t = $('#track').value;
      if (t === 'file' && !Music.audioEl) { $('#mfile').click(); return; }
      if (!Music.play(t)) toast('このブラウザでは音を出せません');
    }
    renderPanel();
  };
  $('#vol').oninput = () => Music.setVolume(+$('#vol').value);
  $('#vol').value = Music.vol;

  $('#votesPer').onchange = () => ctrl({votesPer: +$('#votesPer').value});
  $('#hideVotes').onchange = () => ctrl({hideVotes: $('#hideVotes').checked});
  $('#voteBtn').onclick = () => { const c = S.state.board.control; ctrl({voting: !c.voting, votesPer: +$('#votesPer').value || c.votesPer}); };
  $('#resetVotes').onclick = async () => { if (confirm('すべての票を0にもどします。よろしいですか？')) handle(await api({action: 'resetVotes', b: S.boardId})); };

  $('#aiBtn').onclick = runSummary;
  $('#lastSum').onclick = () => showSummary(S.state.board.control.summary);

  $('#freeMove').onchange = () => ctrl({freeMove: $('#freeMove').checked});
  $('#qrBtn').onclick = showQR;
  $('#infoBtn').onclick = editInfo;
  $('#csvBtn').onclick = exportCSV;
  $('#clearBtn').onclick = async () => {
    if (!confirm('このボードの付箋をすべて消します。元にもどせません。よろしいですか？')) return;
    handle(await api({action: 'clearNotes', b: S.boardId}));
  };
}

function renderPanel() {
  if (!$('#panel') || !S.state) return;
  const c = S.state.board.control, ns = S.state.notes;
  $('#pstats').textContent = `付箋 ${ns.length}枚・書いた人 ${new Set(ns.map(n => n.cid)).size}人・票 ${ns.reduce((a, n) => a + n.votes.length, 0)}`;
  const sb = $('#stopBtn');
  sb.textContent = c.stopped ? '▶ 作業を再開する' : '✋ いったん止める';
  sb.className = 'big ' + (c.stopped ? 'on' : 'danger');
  if (document.activeElement !== $('#stopMsgIn')) $('#stopMsgIn').value = c.stopMsg || '';
  $('#tPause').textContent = c.timerEnd > 0 ? '⏸ 一時停止' : '▶ 再開';
  $('#tPause').disabled = !(c.timerEnd > 0 || c.timerPaused > 0);
  $('#playBtn').textContent = Music.track ? '■ 停止' : '▶ 再生';
  if (document.activeElement !== $('#votesPer')) $('#votesPer').value = c.votesPer;
  $('#hideVotes').checked = c.hideVotes;
  $('#freeMove').checked = c.freeMove;
  const vb = $('#voteBtn');
  vb.textContent = c.voting ? '⏹ 投票を締め切る' : '⭐ 投票を始める';
  vb.className = 'big ' + (c.voting ? 'on' : '');
  $('#lastSum').disabled = !c.summary;
}

function studentURL() { return location.origin + location.pathname + '?b=' + encodeURIComponent(S.boardId); }
function showQR() {
  const url = studentURL();
  const m = openModal(`<div class="qrbox"><h2 style="margin:0">${esc(S.state.board.title)}</h2>
    <div id="qr"></div><div class="url">${esc(url)}</div>
    ${GAS_URL ? '' : '<div class="muted" style="font-size:12px">※デモモードではこの端末でしか開けません</div>'}
    <div class="row"><button id="copy">URLをコピー</button><button class="primary" id="cl">とじる</button></div></div>`, 'wide');
  if (window.QRCode) new QRCode($('#qr', m), {text: url, width: 340, height: 340, correctLevel: QRCode.CorrectLevel.M});
  else $('#qr', m).innerHTML = '<p class="muted">QRを表示できませんでした（URLを共有してください）</p>';
  $('#cl', m).onclick = closeModal;
  $('#copy', m).onclick = () => { navigator.clipboard && navigator.clipboard.writeText(url).then(() => toast('コピーしました')); };
}

function editInfo() {
  const b = S.state.board;
  const m = openModal(`<h2>タイトル・問いを編集</h2>
    <div style="display:grid;gap:8px"><input id="it" maxlength="60" value="${esc(b.title)}"><textarea id="iq" maxlength="200" style="min-height:80px;font-size:16px">${esc(b.question)}</textarea></div>
    <div class="actions"><button id="cancel">キャンセル</button><button class="primary" id="save">保存</button></div>`);
  $('#cancel', m).onclick = closeModal;
  $('#save', m).onclick = async () => { const r = await api({action: 'info', b: S.boardId, title: $('#it', m).value.trim(), question: $('#iq', m).value.trim()}); if (handle(r)) closeModal(); };
}

function exportCSV() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['本文', '書いた人', '色', '票数', '貼った時刻', 'x', 'y'].map(q).join(',')];
  S.state.notes.slice().sort((a, b) => a.createdAt - b.createdAt).forEach(n => rows.push([n.text, n.author, COLOR_NAMES[n.color], n.votes.length, new Date(n.createdAt).toLocaleString('ja-JP'), n.x, n.y].map(q).join(',')));
  const blob = new Blob(['\ufeff' + rows.join('\r\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = (S.state.board.title || 'board') + '.csv'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------------- はじまり ----------------
(function start() {
  const p = new URLSearchParams(location.search);
  if (p.has('t')) {
    let saved = ''; try { saved = sessionStorage.getItem('jb_pass') || ''; } catch (e) {}
    if (saved) { S.pass = saved; S.role = 'teacher'; if (!S.name) S.name = '先生'; showTeacherHome(); }
    else showTeacherLogin();
  } else if (p.get('b')) {
    if (S.name) enterBoard(p.get('b')); else askNameThen(p.get('b'));
  } else showStudentHome();
})();
</script>
